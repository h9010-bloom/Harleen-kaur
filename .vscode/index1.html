<!Doctype html>
<html>
    <head>
        <title>Registration form example</title>
    </head>
    <body>
        <h1>REGIASTRATION FORM </h1>
        <form>
            <label for="fname">First Name: </label>
            <br>
            <input type="fname" id="fname" placeholder="Enter your first name">
            <br>
            <label for="lname">Last Name: </label>
            <br>
            <input type="lname" id="lname" placeholder="Enter your last name">
            <br>
            <label for="age">Age: </label>
            <br>
            <input type="age" id="age" placeholder="Enter your current age">
            <br>
            <label for="gender">Gender: </label>
            <br>
            <label for="DOB">DOB: </label>
            <br>
            <input type="date" id="DOB">
            <br>
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label>
            <input type="radio" id="other" name="gender" value="other">
            <label for="other">Other</label>
            <br>
            <br>
            <label for="email">Email: </label>
            <br>
            <textarea rows="4" cols="10" placeholder="Enter your email"></textarea>
            <br>
            <label for="address">Address: </label>
            <br>
            <textarea rows="4" cols="30" placeholder="Enter your address"></textarea>
            <br>
            <label for="course">Course: </label>
            <select>
                <option>--choose your course--</option>
                <option>B.tech</option>
                <option>BCA</option>
                <option>MCA</option>
                <option>BBA</option>
            </select>
            <br>
            <br>
            <label for="States">States: </label>
            <select>
                <option>--select your state--</option>
                <option>Punjab</option>
                <option>Andhra Pradesh</option>
                <option>Karnataka</option>
                <option>Tamil Nadu</option>
                <option>Kerala</option>
            </select>

            <br>
            <br>
            <input type="submit" value="Submit">
            <input type="reset" value="reset">
        </form>
    </body>
</html>
