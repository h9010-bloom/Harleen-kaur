<!doctype html>
<html>
    <head>
        <title>
            EXAMPLE
        </title>
    </head>
    <body>
        <h1> check the number is even or not</h1>
        <script>
            for(let i=0;i<=15;i++)
        {
            if(i%2==0)
            {
                document.write(i+" is even<br>")
            }else
            {
                document.write(i+" is odd<br>")
            }
        }
        </script>
    </body>
</html>
