<!DOCTYPE html>
<html>
    <head>
        <title>List Example</title>
         <style>
            .roman-list{list-style-type:upper-roman;}
        </style>
    </head>
    <body>
        <h1>List Example</h1>
        <h3>States List with their common cities: </h3>
        <ol>
            <li>Punjab</li>
            <ul class="roman-list">
                <li>Amritsar</li>
                <li>Jalandhar</li>
                <li>Ludhiana</li>
            </ul>
            <li>Delhi</li>
            <ul class="roman-list">
                <li>North Delhi</li>
                <li>South Delhi</li>
                <li>New Delhi</li>
            </ul>
            <li>Rajasthan</li>
            <ul class="roman-list">
                <li>Udhaypur</li>
                <li>Jaipur</li>
                <li>Jodhpur</li>
            </ul>
            <li>Maharashtra</li>
            <ul class="roman-list">
                <li>Pune</li>
                <li>Naagpur</li>
                <li>Mumbai</li>
            </ul>
        </ol>
    </body>
</html>
